name: Client iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - ios/client-initial-release
    paths:
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/client-ios-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/client-ios-ci.yml'

permissions:
  contents: read

concurrency:
  group: client-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Environment
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Validate Client iOS configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'PRODUCT_BUNDLE_IDENTIFIER = asia.jetkiz.client;' ios/Runner.xcodeproj/project.pbxproj
          grep -F 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.Debug.entitlements;' ios/Runner.xcodeproj/project.pbxproj
          grep -F 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.Release.entitlements;' ios/Runner.xcodeproj/project.pbxproj
          grep -F 'com.apple.Push' ios/Runner.xcodeproj/project.pbxproj
          grep -F 'com.apple.BackgroundModes' ios/Runner.xcodeproj/project.pbxproj
          grep -F 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ios/Runner.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy -c 'Print :aps-environment' ios/Runner/Runner.Debug.entitlements | grep -Fx 'development'
          /usr/libexec/PlistBuddy -c 'Print :aps-environment' ios/Runner/Runner.Release.entitlements | grep -Fx 'production'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/Runner/Info.plist | grep -Fx 'JETKIZ'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' ios/Runner/Info.plist | grep -F 'remote-notification'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' ios/Runner/Info.plist | grep -Fx 'jetkiz'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLName' ios/Runner/Info.plist | grep -Fx 'asia.jetkiz.client.payment-return'
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' ios/Runner/Info.plist)"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' ios/Runner/Info.plist)"

          echo 'Client iOS project configuration verified'

      - name: Verify production Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail

          PLIST=ios/Runner/GoogleService-Info.plist
          test -s "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST" | grep -Fx 'asia.jetkiz.client'
          /usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$PLIST" | grep -Fx 'jetkiz-mobile'
          /usr/libexec/PlistBuddy -c 'Print :GCM_SENDER_ID' "$PLIST" | grep -Fx '97147344656'
          /usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "$PLIST" | grep -Fx '1:97147344656:ios:2e897fbdf28266895f7795'

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('lib/firebase_options.dart').read_text()
          match = re.search(
              r'static const FirebaseOptions ios = FirebaseOptions\((.*?)\n  \);',
              text,
              re.S,
          )
          if not match:
              raise SystemExit('iOS FirebaseOptions block not found')

          block = match.group(1)
          required = [
              "apiKey: 'AIzaSyCzMILm99MIxSGAkmFv4R2U2HPsFwitZZM'",
              "appId: '1:97147344656:ios:2e897fbdf28266895f7795'",
              "messagingSenderId: '97147344656'",
              "projectId: 'jetkiz-mobile'",
              "iosBundleId: 'asia.jetkiz.client'",
          ]
          missing = [value for value in required if value not in block]
          if missing:
              raise SystemExit(f'Invalid iOS FirebaseOptions: missing {missing}')
          if 'com.example.jetkizMobile' in block:
              raise SystemExit('Legacy iOS Firebase bundle id is still configured')
          PY

          echo 'Production Client Firebase iOS configuration verified'

      - name: Build iPhone Simulator
        run: flutter build ios --simulator --debug

      - name: Verify simulator bundle
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'asia.jetkiz.client'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'JETKIZ'
          echo 'Client iOS simulator bundle verified'

      - name: Build unsigned iPhone release
        run: flutter build ios --release --no-codesign

      - name: Verify unsigned iPhone release
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'asia.jetkiz.client'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'JETKIZ'
          file "$APP/Runner" | grep -E 'arm64|Mach-O'
          du -sh "$APP"
          echo 'Unsigned Client release for physical iPhone verified'

      - name: Verify packaged privacy manifests
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          PRIVACY_MANIFESTS="$(find "$APP" -name PrivacyInfo.xcprivacy -type f -print)"
          printf '%s\n' "$PRIVACY_MANIFESTS"
          PRIVACY_MANIFEST_COUNT="$(printf '%s\n' "$PRIVACY_MANIFESTS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$PRIVACY_MANIFEST_COUNT" -eq 0 ]; then
            echo '::error::No PrivacyInfo.xcprivacy was packaged in the iPhone release'
            exit 1
          fi
          echo "Packaged privacy manifests: $PRIVACY_MANIFEST_COUNT"

      - name: Boot iPhone Simulator and launch Client
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios-smoke

          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[r for r in d["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name","")]; a.sort(key=lambda r: tuple(int(x) for x in r.get("version","0").split("."))); print(a[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; a=[d for d in json.load(sys.stdin)["devicetypes"] if d.get("name","").startswith("iPhone")]; pref=["iPhone 17 Pro","iPhone 17","iPhone 16 Pro","iPhone 16"]; by={d["name"]:d for d in a}; pick=next((by[n] for n in pref if n in by),a[-1]); print(pick["identifier"])')

          UDID=$(xcrun simctl create "JETKIZ Client CI" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" asia.jetkiz.client | tee build/ios-smoke/launch.txt
          sleep 8

          xcrun simctl spawn "$UDID" launchctl list | grep -F 'asia.jetkiz.client'
          xcrun simctl openurl "$UDID" 'jetkiz://payment/return?result=success'
          sleep 2
          xcrun simctl spawn "$UDID" launchctl list | grep -F 'asia.jetkiz.client'
          xcrun simctl io "$UDID" screenshot build/ios-smoke/client-login.png
          xcrun simctl spawn "$UDID" log show --style compact --last 3m --predicate 'process == "Runner"' > build/ios-smoke/runner.log || true
          test -s build/ios-smoke/client-login.png

          if grep -Fq 'Firebase initialization failed' build/ios-smoke/runner.log; then
            echo 'Firebase bootstrap error detected in Client simulator log' >&2
            grep -F 'Firebase initialization failed' build/ios-smoke/runner.log >&2 || true
            exit 1
          fi
          if grep -Fq '[core/not-initialized]' build/ios-smoke/runner.log; then
            echo 'Firebase core/not-initialized error detected in Client simulator log' >&2
            grep -F '[core/not-initialized]' build/ios-smoke/runner.log >&2 || true
            exit 1
          fi

          echo 'JETKIZ Client launched, handled payment return URL, and remained alive in iPhone Simulator'

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-ios-simulator-evidence
          path: |
            build/ios-smoke/client-login.png
            build/ios-smoke/launch.txt
            build/ios-smoke/runner.log
          if-no-files-found: warn
          retention-days: 14

      - name: Shutdown simulator
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
