name: Dispatch Client Auth Smoke Once

on:
  push:
    branches:
      - ios/client-initial-release
    paths:
      - '.github/workflows/dispatch-client-auth-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch strict Client iOS auth smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jetkizdigital-droid/jetkiz-client-app/actions/workflows/client-ios-auth-smoke.yml/dispatches \
            -d '{"ref":"ios/client-initial-release"}'
          echo "Client auth smoke dispatched"
