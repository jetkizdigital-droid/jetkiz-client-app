name: Client Localization Source Audit 2026-09-26

on:
  push:
    branches:
      - audit/client-localization-scan-20260926

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan static LocalizedText RU catalogue coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          catalogue = pathlib.Path('lib/core/localization/appStrings.dart').read_text(encoding='utf-8')
          key_pattern = re.compile(r"^\s*'((?:\\.|[^'\\])*)'\s*:", re.MULTILINE)
          keys = {m.group(1).replace('\\n', '\n').replace("\\'", "'") for m in key_pattern.finditer(catalogue)}

          pattern = re.compile(
              r'\bLocalizedText\s*\(\s*([\'\"])(?P<value>(?:\\.|(?!\1).)*)\1',
              re.DOTALL,
          )
          cyr = re.compile(r'[А-Яа-яЁё]')
          missing = []

          for path in sorted(pathlib.Path('lib/features').glob('**/presentation/**/*.dart')):
              source = path.read_text(encoding='utf-8')
              for match in pattern.finditer(source):
                  raw = match.group('value')
                  value = raw.replace('\\n', '\n').replace("\\'", "'").replace('\\\"', '"')
                  if not cyr.search(value):
                      continue
                  if '$' in value:
                      continue
                  if value not in keys:
                      line = source.count('\n', 0, match.start()) + 1
                      missing.append((str(path), line, value.replace('\n', '\\n')))

          print(f'STATIC_LOCALIZED_MISSING_COUNT={len(missing)}')
          for path, line, value in missing:
              print(f'{path}:{line}: {value}')
          PY
