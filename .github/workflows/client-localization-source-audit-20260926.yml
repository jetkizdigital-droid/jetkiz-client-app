name: Client Localization Source Audit 2026-09-26

on:
  push:
    branches:
      - audit/client-localization-scan-20260926

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan direct unlocalized RU text
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          roots = sorted(pathlib.Path('lib/features').glob('**/presentation/**/*.dart'))
          cyr = r'[А-Яа-яЁё]'

          patterns = [
              ('Text', re.compile(r'(?<!Localized)\bText\s*\(\s*([\'\"])(?P<value>(?:\\.|(?!\1).)*)\1', re.DOTALL)),
              ('TextSpan', re.compile(r'\bTextSpan\s*\([^)]*?\btext\s*:\s*([\'\"])(?P<value>(?:\\.|(?!\1).)*)\1', re.DOTALL)),
          ]

          hits = []
          for path in roots:
              source = path.read_text(encoding='utf-8')
              for kind, pattern in patterns:
                  for match in pattern.finditer(source):
                      value = match.group('value')
                      if not re.search(cyr, value):
                          continue
                      line = source.count('\n', 0, match.start()) + 1
                      hits.append((str(path), line, kind, value.replace('\n', '\\n')))

          print(f'DIRECT_UNLOCALIZED_COUNT={len(hits)}')
          for path, line, kind, value in hits:
              print(f'{path}:{line}: {kind}: {value}')
          PY
