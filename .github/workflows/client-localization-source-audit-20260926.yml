name: Client Localization Source Audit 2026-09-26

on:
  push:
    branches:
      - audit/client-localization-scan-20260926

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan RU literals missing from KK catalogue
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import re

          root = pathlib.Path('lib')
          catalogue_source = (root / 'core/localization/appStrings.dart').read_text(encoding='utf-8')

          # Extract exact RU keys from the Dart map. This is intentionally a
          # diagnostic audit, not a build gate.
          key_pattern = re.compile(r"^\s*'((?:\\.|[^'\\])*)'\s*:", re.MULTILINE)
          keys = {bytes(m.group(1), 'utf-8').decode('unicode_escape') if '\\' in m.group(1) else m.group(1)
                  for m in key_pattern.finditer(catalogue_source)}

          literal_pattern = re.compile(r"(?<![A-Za-z0-9_])(['\"])((?:\\.|(?!\1).)*)\1", re.DOTALL)
          cyr = re.compile(r'[А-Яа-яЁё]')

          missing = []
          for path in sorted(root.glob('features/**/presentation/**/*.dart')):
              source = path.read_text(encoding='utf-8')
              for m in literal_pattern.finditer(source):
                  value = m.group(2)
                  if not cyr.search(value):
                      continue
                  # Ignore import-like or code-ish strings.
                  if value.startswith('package:') or value.startswith('http'):
                      continue
                  normalized = value.replace('\\n', '\n').replace("\\'", "'").replace('\\\"', '"')
                  if normalized not in keys:
                      line = source.count('\n', 0, m.start()) + 1
                      missing.append((str(path), line, normalized))

          seen = set()
          unique = []
          for item in missing:
              key = (item[0], item[2])
              if key in seen:
                  continue
              seen.add(key)
              unique.append(item)

          print(f'MISSING_COUNT={len(unique)}')
          for path, line, value in unique:
              printable = value.replace('\n', '\\n')
              print(f'{path}:{line}: {printable}')
          PY
