name: Payment Recovery Finalize

on:
  push:
    branches: [payment/paylink-production-flutter-20260908]
    paths: [.github/workflows/payment-recovery-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout payment branch
        uses: actions/checkout@v4
        with:
          ref: payment/paylink-production-flutter-20260908

      - name: Apply interrupted-payment recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_payment_recovery_patch.py

      - name: Make recovery lifecycle-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/checkout/presentation/checkoutPage.dart')
          s = p.read_text(encoding='utf-8')
          old = "    _loadDeliveryFee();\n    _loadSavedCards();\n    _recoverPendingPayment();\n"
          new = "    _loadDeliveryFee();\n    _loadSavedCards();\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (mounted) {\n        _recoverPendingPayment();\n      }\n    });\n"
          if old not in s:
              raise SystemExit('recovery init anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify payment security invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'PAYLINK_API_KEY|X-API-KEY|PAYMENT_TOKEN_ENCRYPTION_KEY' lib; then
            echo 'Provider/server secret reference found in Flutter source'
            exit 1
          fi
          if grep -n -E 'Text(Form)?Field' lib/features/payments/presentation/addPaymentCardPage.dart; then
            echo 'PAN/CVV-style input field found in add-card page'
            exit 1
          fi
          grep -F "fundsSecured" lib/features/payments/data/paymentCheckoutApi.dart
          grep -F "paymentMethod.toUpperCase() != 'CARD'" lib/features/payments/data/paymentCheckoutApi.dart
          grep -F "payment_pending_order_id" lib/features/payments/data/paymentPendingStore.dart
          grep -F "_legacyCheckoutUrlKey" lib/features/payments/data/paymentPendingStore.dart
          grep -F "_recoverPendingPayment" lib/features/checkout/presentation/checkoutPage.dart
          grep -F "PaymentMethodsPage" lib/features/profile/presentation/profilePage.dart
          echo 'Payment security invariants verified'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare ephemeral release signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/client-ci-upload.jks" \
            -storepass ci-not-for-production \
            -keypass ci-not-for-production \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -alias client-ci \
            -dname "CN=JETKIZ Client CI,O=JETKIZ,C=KZ"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/client-ci-upload.jks
          storePassword=ci-not-for-production
          keyAlias=client-ci
          keyPassword=ci-not-for-production
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          unzip -t build/app/outputs/bundle/release/app-release.aab >/dev/null
          echo 'Release APK and AAB verified'

      - name: Commit production recovery and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/payment-recovery-finalize.yml
          rm -f tools/apply_payment_recovery_patch.py
          rm -f android/key.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(payments): harden interrupted payment recovery'
          git push origin HEAD:payment/paylink-production-flutter-20260908

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/client-ci-upload.jks"
