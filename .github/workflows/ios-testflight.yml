name: JETKIZ Client TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetkiz-client-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEAM_ID: 4BV9Z8J6H4
      BUNDLE_ID: asia.jetkiz.client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check signing configuration
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          test -n "$CERT"
          test -n "$CERT_PASSWORD"
          test -n "$PROFILE"
          test -n "$API_KEY"
          test -n "$KEY_ID"
          test -n "$ISSUER_ID"
      - name: Import Apple distribution certificate and profile
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing" "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/signing/distribution.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signing/jetkiz.mobileprovision"
          security create-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/jetkiz.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/jetkiz.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP" "$RUNNER_TEMP/jetkiz.keychain-db"
          security import "$RUNNER_TEMP/signing/distribution.p12" -k "$RUNNER_TEMP/jetkiz.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$RUNNER_TEMP/jetkiz.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/jetkiz.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/jetkiz.keychain-db"
          /usr/bin/security find-identity -v -p codesigning "$RUNNER_TEMP/jetkiz.keychain-db"
          security cms -D -i "$RUNNER_TEMP/signing/jetkiz.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/signing/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/signing/profile.plist")
          test "$APP_ID" = "$TEAM_ID.$BUNDLE_ID"
          cp "$RUNNER_TEMP/signing/jetkiz.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate manual export options
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
          </dict>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
      - name: Build signed iOS IPA
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/exportOptions.plist" --dart-define=JETKIZ_API_BASE_URL=https://api.jetkiz.asia
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - name: Remove sensitive signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/exportOptions.plist" "$RUNNER_TEMP/jetkiz.keychain-db" "$HOME/.appstoreconnect/private_keys"
