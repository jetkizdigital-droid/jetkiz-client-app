name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Build release AAB with ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rm -f android/key.properties android/ci-release.jks
          }
          trap cleanup EXIT
          keytool -genkeypair \
            -keystore android/ci-release.jks \
            -storepass ci-password \
            -keypass ci-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -alias ci \
            -dname "CN=JETKIZ CI, OU=CI, O=JETKIZ, L=Shchuchinsk, ST=Akmola, C=KZ" \
            >/dev/null 2>&1
          cat > android/key.properties <<'EOF'
          storePassword=ci-password
          keyPassword=ci-password
          keyAlias=ci
          storeFile=../ci-release.jks
          EOF
          flutter build appbundle --release
