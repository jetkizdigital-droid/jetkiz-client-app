name: Temporary dependency sync

on:
  push:
    branches:
      - chore/client-dependency-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/client-dependency-sync
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Dependency metadata already synchronized"
            exit 0
          fi

          allowed='^(pubspec\.lock|analysis_options\.yaml|macos/Flutter/GeneratedPluginRegistrant\.swift)$'
          for path in "${changed[@]}"; do
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Unexpected generated change: $path" >&2
              git diff -- "$path"
              exit 1
            fi
          done

          git diff --check
          git diff -- pubspec.lock analysis_options.yaml macos/Flutter/GeneratedPluginRegistrant.swift

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock analysis_options.yaml macos/Flutter/GeneratedPluginRegistrant.swift
          git commit -m "chore(flutter): sync generated dependency metadata"
          git push origin HEAD:chore/client-dependency-sync
