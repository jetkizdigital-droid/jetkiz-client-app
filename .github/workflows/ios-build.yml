name: JETKIZ Client iOS Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Environment
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify Apple application identity
        run: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = asia.jetkiz.client;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'DEVELOPMENT_TEAM = 4BV9Z8J6H4;' ios/Runner.xcodeproj/project.pbxproj
          grep -q '<string>JETKIZ</string>' ios/Runner/Info.plist
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=JETKIZ_API_BASE_URL=https://api.jetkiz.asia
