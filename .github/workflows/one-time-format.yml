name: One-time Dart format

on:
  push:
    branches:
      - feat/account-deletion-kazakh

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format localization changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-deletion-kazakh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib test
      - run: rm .github/workflows/one-time-format.yml
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format localization changes"
          git push
