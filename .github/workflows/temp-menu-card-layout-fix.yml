name: Temporary Menu Card Layout Fix

on:
  push:
    branches:
      - fix/menu-product-card-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-product-card-layout
          fetch-depth: 0

      - name: Apply deterministic menu card fix
        shell: bash
        env:
          HELPER_B64: 
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          helper = Path('lib/features/menu/presentation/productCardLayout.dart')
          helper.write_bytes(base64.b64decode(os.environ['HELPER_B64']))

          restaurant = Path('lib/features/menu/presentation/restaurantMenuPage.dart')
          text = restaurant.read_text(encoding='utf-8')
          import_anchor = "import 'package:jetkiz_mobile/features/menu/presentation/productDetailsPage.dart';\n"
          import_line = "import 'package:jetkiz_mobile/features/menu/presentation/productCardLayout.dart';\n"
          assert import_anchor in text
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_delegate = "          gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(\n            crossAxisCount: 2,\n            crossAxisSpacing: 14,\n            mainAxisSpacing: 14,\n            childAspectRatio: 0.72,\n          ),"
          new_delegate = "          gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(\n            crossAxisCount: 2,\n            crossAxisSpacing: 14,\n            mainAxisSpacing: 14,\n            mainAxisExtent: menuProductCardExtent(\n              context,\n              horizontalPadding: 32,\n            ),\n          ),"
          assert text.count(old_delegate) == 1, text.count(old_delegate)
          text = text.replace(old_delegate, new_delegate, 1)
          assert text.count('                        item.priceText,') == 1
          text = text.replace('                        item.priceText,', '                        formatMenuPrice(item.price),', 1)
          image_anchor = "    final imageUrl = _normalizeUrl(item.mainImageUrl);\n\n    return ClipRRect("
          image_replacement = "    final imageUrl = _normalizeUrl(item.mainImageUrl);\n    final cacheSize = menuProductImageCacheSize(context, horizontalPadding: 32);\n\n    return ClipRRect("
          assert text.count(image_anchor) == 1
          text = text.replace(image_anchor, image_replacement, 1)
          image_fit_anchor = "                imageUrl,\n                fit: BoxFit.cover,\n                filterQuality: FilterQuality.medium,"
          image_fit_replacement = "                imageUrl,\n                fit: BoxFit.cover,\n                cacheWidth: cacheSize,\n                cacheHeight: cacheSize,\n                filterQuality: FilterQuality.medium,"
          assert text.count(image_fit_anchor) == 1
          text = text.replace(image_fit_anchor, image_fit_replacement, 1)
          restaurant.write_text(text, encoding='utf-8')

          category = Path('lib/features/menu/presentation/categoryProductsPage.dart')
          text = category.read_text(encoding='utf-8')
          assert import_anchor in text
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          assert text.count(old_delegate) == 1, text.count(old_delegate)
          category_delegate = "          gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(\n            crossAxisCount: 2,\n            crossAxisSpacing: 14,\n            mainAxisSpacing: 14,\n            mainAxisExtent: menuProductCardExtent(\n              context,\n              horizontalPadding: 30,\n            ),\n          ),"
          text = text.replace(old_delegate, category_delegate, 1)
          assert text.count("                      '${product.price}₸',") == 1
          text = text.replace("                      '${product.price}₸',", '                      formatMenuPrice(product.price),', 1)
          build_anchor = "  @override\n  Widget build(BuildContext context) {\n    return ClipRRect(\n      borderRadius: BorderRadius.circular(16),\n      child: AspectRatio("
          build_replacement = "  @override\n  Widget build(BuildContext context) {\n    final cacheSize = menuProductImageCacheSize(context);\n\n    return ClipRRect(\n      borderRadius: BorderRadius.circular(16),\n      child: AspectRatio("
          assert text.count(build_anchor) == 1, text.count(build_anchor)
          text = text.replace(build_anchor, build_replacement, 1)
          fit_anchor = "                imageUrl!,\n                fit: BoxFit.cover,\n                errorBuilder:"
          fit_replacement = "                imageUrl!,\n                fit: BoxFit.cover,\n                cacheWidth: cacheSize,\n                cacheHeight: cacheSize,\n                errorBuilder:"
          assert text.count(fit_anchor) == 1
          text = text.replace(fit_anchor, fit_replacement, 1)
          category.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git status --short

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/menu/presentation/productCardLayout.dart \
                  lib/features/menu/presentation/restaurantMenuPage.dart \
                  lib/features/menu/presentation/categoryProductsPage.dart
          git commit -m "fix(menu): prevent product card overflow on narrow screens"
          git push origin HEAD:fix/menu-product-card-layout
