name: Temporary Menu Price Fit Fix

on:
  push:
    branches:
      - fix/menu-product-card-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-product-card-layout
          fetch-depth: 0

      - name: Keep prices readable beside cart controls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          replacements = [
              (
                  Path('lib/features/menu/presentation/restaurantMenuPage.dart'),
                  'formatMenuPrice(item.price)',
              ),
              (
                  Path('lib/features/menu/presentation/categoryProductsPage.dart'),
                  'formatMenuPrice(product.price)',
              ),
          ]

          for path, price_expr in replacements:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  rf"(?P<i>^[ \t]+)Expanded\(\n"
                  rf"(?P=i)  child: LocalizedText\(\n"
                  rf"(?P=i)    {re.escape(price_expr)},\n"
                  rf"(?P=i)    maxLines: 1,\n"
                  rf"(?P=i)    overflow: TextOverflow\.ellipsis,\n"
                  rf"(?P=i)    style: const TextStyle\(\n"
                  rf"(?P=i)      color: Colors\.black,\n"
                  rf"(?P=i)      fontSize: 22,\n"
                  rf"(?P=i)      fontWeight: FontWeight\.w900,\n"
                  rf"(?P=i)      height: 1\.0,\n"
                  rf"(?P=i)    \),\n"
                  rf"(?P=i)  \),\n"
                  rf"(?P=i)\),",
                  re.MULTILINE,
              )
              matches = list(pattern.finditer(text))
              assert len(matches) == 1, (path, len(matches))
              match = matches[0]
              indent = match.group('i')
              replacement = (
                  f"{indent}Expanded(\n"
                  f"{indent}  child: FittedBox(\n"
                  f"{indent}    fit: BoxFit.scaleDown,\n"
                  f"{indent}    alignment: Alignment.centerLeft,\n"
                  f"{indent}    child: LocalizedText(\n"
                  f"{indent}      {price_expr},\n"
                  f"{indent}      maxLines: 1,\n"
                  f"{indent}      overflow: TextOverflow.ellipsis,\n"
                  f"{indent}      style: const TextStyle(\n"
                  f"{indent}        color: Colors.black,\n"
                  f"{indent}        fontSize: 22,\n"
                  f"{indent}        fontWeight: FontWeight.w900,\n"
                  f"{indent}        height: 1.0,\n"
                  f"{indent}      ),\n"
                  f"{indent}    ),\n"
                  f"{indent}  ),\n"
                  f"{indent}),"
              )
              path.write_text(pattern.sub(replacement, text, count=1), encoding='utf-8')
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/menu/presentation/restaurantMenuPage.dart \
                  lib/features/menu/presentation/categoryProductsPage.dart
          git commit -m "fix(menu): keep prices readable beside cart controls"
          git push origin HEAD:fix/menu-product-card-layout
