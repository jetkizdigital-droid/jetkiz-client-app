name: Temporary search analytics correlation patch

on:
  push:
    branches:
      - fix/search-analytics-correlation-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/search-analytics-correlation-v2
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply deterministic search analytics patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/search/presentation/searchPage.dart')
          text = path.read_text(encoding='utf-8')

          duplicate_start = text.index("      final restaurantsCount = result.restaurants.length;")
          duplicate_end = text.index("    } catch (_)", duplicate_start)
          text = text[:duplicate_start] + text[duplicate_end:]

          click_start = text.index("  Future<void> _trackSearchResultClick({")
          click_end = text.index("  Future<void> _trackClientEvent({", click_start)
          replacement = """  Future<void> _trackSearchResultClick({
            required String query,
            required String entityType,
            required String entityId,
            required String title,
            required int position,
            Map<String, dynamic>? metadata,
          }) async {
            await _trackSearchClick(
              searchQueryLogId: _result.searchQueryLogId,
              query: query,
              entityType: entityType,
              entityId: entityId,
              position: position,
              title: title,
              metadata: metadata,
            );
          }

          Future<void> _trackSearchClick({
            String? searchQueryLogId,
            required String query,
            required String entityType,
            required String entityId,
            required int position,
            required String title,
            Map<String, dynamic>? metadata,
          }) async {
            try {
              final deviceId = await _apiClient.getDeviceId();

              await _apiClient.dio.post(
                '/search/click',
                data: {
                  if (searchQueryLogId?.trim().isNotEmpty == true)
                    'searchQueryLogId': searchQueryLogId!.trim(),
                  'query': query,
                  'entityType': entityType,
                  'entityId': entityId,
                  'position': position,
                  'sessionId': _searchApi.sessionId,
                  'deviceId': deviceId,
                  'platform': _backendPlatformName(),
                  'appVersion': SearchApi.appVersion,
                  'metadata': {
                    'title': title,
                    'source': 'search_page',
                    if (metadata != null) ...metadata,
                  },
                },
              );
            } on DioException catch (error) {
              if (kDebugMode) {
                debugPrint(
                  'SearchPage: /search/click failed: ${error.response?.statusCode} ${error.response?.data}',
                );
              }
            } catch (error) {
              if (kDebugMode) {
                debugPrint('SearchPage: /search/click failed: $error');
              }
            }
          }

          """
          text = text[:click_start] + replacement + text[click_end:]

          text = text.replace("          'appVersion': '1.0.0',", "          'appVersion': SearchApi.appVersion,")
          text = text.replace("            'appVersion': '1.0.0',", "            'appVersion': SearchApi.appVersion,")
          text = text.replace("            'locale': 'ru',\n", "")

          backend_anchor = "  String _backendPlatformName() {\n    switch (defaultTargetPlatform) {"
          backend_replace = "  String _backendPlatformName() {\n    if (kIsWeb) return 'WEB';\n\n    switch (defaultTargetPlatform) {"
          if backend_anchor not in text:
              raise SystemExit('backend platform anchor mismatch')
          text = text.replace(backend_anchor, backend_replace, 1)

          client_anchor = "  String _clientPlatformName() {\n    switch (defaultTargetPlatform) {"
          client_replace = "  String _clientPlatformName() {\n    if (kIsWeb) return 'web';\n\n    switch (defaultTargetPlatform) {"
          if client_anchor not in text:
              raise SystemExit('client platform anchor mismatch')
          text = text.replace(client_anchor, client_replace, 1)

          path.write_text(text, encoding='utf-8')
          PY

          dart format lib/features/search/presentation/searchPage.dart \
            lib/features/search/data/searchApi.dart \
            lib/features/search/domain/searchResult.dart

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "lib/features/search/presentation/searchPage.dart"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/search/presentation/searchPage.dart
          git commit -m "fix(search): correlate clicks with canonical search logs"
          git push origin HEAD:fix/search-analytics-correlation-v2
