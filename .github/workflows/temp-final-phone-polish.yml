name: Temp final phone polish

on:
  push:
    branches:
      - fix/final-phone-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-phone-polish
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply UI and support fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shared card helpers: natural 4:3 image area and grouped tenge formatting.
          path = 'lib/features/menu/presentation/productCardLayout.dart'
          replace_once(
              path,
              "import 'package:flutter/material.dart';\n\n/// Decode food images close to their actual on-screen size without changing\n",
              "import 'package:flutter/material.dart';\n\nconst double menuProductImageAspectRatio = 4 / 3;\n\nString formatMenuPrice(int price) {\n  final sign = price < 0 ? '-' : '';\n  final digits = price.abs().toString();\n  final groups = <String>[];\n\n  for (var end = digits.length; end > 0; end -= 3) {\n    final start = end - 3 < 0 ? 0 : end - 3;\n    groups.insert(0, digits.substring(start, end));\n  }\n\n  return '$sign${groups.join(' ')} ₸';\n}\n\n/// Decode food images close to their actual on-screen size without changing\n",
          )

          # Restaurant menu: give names a real fixed area, make long prices fit,
          # preserve source image proportions, and use a stable text star glyph.
          path = 'lib/features/menu/presentation/restaurantMenuPage.dart'
          replace_once(
              path,
              "  String get _restaurantRatingText {\n    final dynamic restaurant = _menuData?.restaurant;\n\n    final raw = _firstNonEmpty([\n      _readDynamicString(restaurant, 'ratingAvg'),\n      _readDynamicString(restaurant, 'rating'),\n    ]);\n\n    if (raw == null) return '—';\n\n    final parsed = double.tryParse(raw.replaceAll(',', '.'));\n    if (parsed == null || parsed <= 0) return raw;\n\n    return parsed.toStringAsFixed(1);\n  }\n",
              "  String get _restaurantRatingText {\n    final rating = _menuData?.restaurant.ratingAvg;\n    if (rating == null || rating <= 0) return '—';\n    return rating.toStringAsFixed(1);\n  }\n",
          )
          replace_once(
              path,
              "                    const Icon(\n                      Icons.star_rounded,\n                      size: 16,\n                      color: Color(0xFF489F2A),\n                    ),\n",
              "                    const Text(\n                      '★',\n                      style: TextStyle(\n                        fontSize: 17,\n                        height: 1,\n                        fontWeight: FontWeight.w700,\n                        color: Color(0xFF489F2A),\n                      ),\n                    ),\n",
          )
          replace_once(
              path,
              "                Expanded(\n                  child: Column(\n                    crossAxisAlignment: CrossAxisAlignment.start,\n                    children: [\n                      LocalizedText(\n                        item.title,\n                        maxLines: 2,\n                        overflow: TextOverflow.ellipsis,\n                        style: const TextStyle(\n                          color: Colors.black,\n                          fontSize: 12,\n                          fontWeight: FontWeight.w700,\n                          height: 1.15,\n                        ),\n                      ),\n                    ],\n                  ),\n                ),\n",
              "                SizedBox(\n                  height: 30,\n                  child: Align(\n                    alignment: Alignment.topLeft,\n                    child: LocalizedText(\n                      item.title,\n                      maxLines: 2,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        color: Colors.black,\n                        fontSize: 12,\n                        fontWeight: FontWeight.w700,\n                        height: 1.15,\n                      ),\n                    ),\n                  ),\n                ),\n",
          )
          replace_once(
              path,
              "                    Expanded(\n                      child: LocalizedText(\n                        item.priceText,\n                        maxLines: 1,\n                        overflow: TextOverflow.ellipsis,\n                        style: const TextStyle(\n                          color: Colors.black,\n                          fontSize: 22,\n                          fontWeight: FontWeight.w900,\n                          height: 1.0,\n                        ),\n                      ),\n                    ),\n",
              "                    Expanded(\n                      child: FittedBox(\n                        fit: BoxFit.scaleDown,\n                        alignment: Alignment.centerLeft,\n                        child: LocalizedText(\n                          formatMenuPrice(item.price),\n                          maxLines: 1,\n                          style: const TextStyle(\n                            color: Colors.black,\n                            fontSize: 18,\n                            fontWeight: FontWeight.w900,\n                            height: 1.0,\n                          ),\n                        ),\n                      ),\n                    ),\n",
          )
          replace_once(
              path,
              "      child: AspectRatio(\n        aspectRatio: 1,\n",
              "      child: AspectRatio(\n        aspectRatio: menuProductImageAspectRatio,\n",
          )
          replace_once(
              path,
              "                cacheWidth: cacheSize,\n                cacheHeight: cacheSize,\n",
              "                cacheWidth: cacheSize,\n",
          )
          replace_once(
              path,
              "        width: 74,\n        height: 36,\n",
              "        width: 56,\n        height: 36,\n",
          )
          replace_once(
              path,
              "            padding: const EdgeInsets.symmetric(horizontal: 8),\n",
              "            padding: const EdgeInsets.symmetric(horizontal: 5),\n",
          )
          replace_once(
              path,
              "        width: 28,\n        height: 28,\n",
              "        width: 24,\n        height: 28,\n",
          )

          # Category product listing gets the same stable card geometry.
          path = 'lib/features/menu/presentation/categoryProductsPage.dart'
          replace_once(
              path,
              "              Expanded(\n                child: LocalizedText(\n                  product.title,\n                  maxLines: 2,\n                  overflow: TextOverflow.ellipsis,\n                  style: const TextStyle(\n                    color: Colors.black,\n                    fontSize: 12,\n                    fontWeight: FontWeight.w700,\n                    height: 1.15,\n                  ),\n                ),\n              ),\n",
              "              SizedBox(\n                height: 30,\n                child: Align(\n                  alignment: Alignment.topLeft,\n                  child: LocalizedText(\n                    product.title,\n                    maxLines: 2,\n                    overflow: TextOverflow.ellipsis,\n                    style: const TextStyle(\n                      color: Colors.black,\n                      fontSize: 12,\n                      fontWeight: FontWeight.w700,\n                      height: 1.15,\n                    ),\n                  ),\n                ),\n              ),\n",
          )
          replace_once(
              path,
              "                  Expanded(\n                    child: LocalizedText(\n                      '${product.price}₸',\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        color: Colors.black,\n                        fontSize: 22,\n                        fontWeight: FontWeight.w900,\n                        height: 1.0,\n                      ),\n                    ),\n                  ),\n",
              "                  Expanded(\n                    child: FittedBox(\n                      fit: BoxFit.scaleDown,\n                      alignment: Alignment.centerLeft,\n                      child: LocalizedText(\n                        formatMenuPrice(product.price),\n                        maxLines: 1,\n                        style: const TextStyle(\n                          color: Colors.black,\n                          fontSize: 18,\n                          fontWeight: FontWeight.w900,\n                          height: 1.0,\n                        ),\n                      ),\n                    ),\n                  ),\n",
          )
          replace_once(
              path,
              "      child: AspectRatio(\n        aspectRatio: 1,\n",
              "      child: AspectRatio(\n        aspectRatio: menuProductImageAspectRatio,\n",
          )
          replace_once(
              path,
              "                cacheWidth: cacheSize,\n                cacheHeight: cacheSize,\n",
              "                cacheWidth: cacheSize,\n",
          )
          replace_once(
              path,
              "        width: 74,\n        height: 36,\n",
              "        width: 56,\n        height: 36,\n",
          )
          replace_once(
              path,
              "      width: 96,\n      height: 36,\n",
              "      width: 72,\n      height: 36,\n",
          )
          replace_once(
              path,
              "      padding: const EdgeInsets.symmetric(horizontal: 6),\n",
              "      padding: const EdgeInsets.symmetric(horizontal: 4),\n",
          )

          # Parse the restaurant metadata that the backend already sends.
          path = 'lib/features/menu/domain/restaurantMenuData.dart'
          replace_once(
              path,
              "    this.descriptionRu,\n    this.descriptionKk,\n    this.serverIsOpenNow,\n",
              "    this.descriptionRu,\n    this.descriptionKk,\n    this.coverImageUrl,\n    this.ratingAvg,\n    this.ratingCount = 0,\n    this.address,\n    this.serverIsOpenNow,\n",
          )
          replace_once(
              path,
              "  final String? descriptionRu;\n  final String? descriptionKk;\n  final bool? serverIsOpenNow;\n",
              "  final String? descriptionRu;\n  final String? descriptionKk;\n  final String? coverImageUrl;\n  final double? ratingAvg;\n  final int ratingCount;\n  final String? address;\n  final bool? serverIsOpenNow;\n",
          )
          replace_once(
              path,
              "      descriptionRu: _readNullableString(json['descriptionRu']),\n      descriptionKk: _readNullableString(json['descriptionKk']),\n      serverIsOpenNow: _readNullableBool(json['isOpenNow']),\n",
              "      descriptionRu: _readNullableString(json['descriptionRu']),\n      descriptionKk: _readNullableString(json['descriptionKk']),\n      coverImageUrl: normalizeUrl(json['coverImageUrl']),\n      ratingAvg: _readNullableDouble(json['ratingAvg'] ?? json['rating']),\n      ratingCount: _readInt(json['ratingCount']),\n      address: _readNullableString(json['address']),\n      serverIsOpenNow: _readNullableBool(json['isOpenNow']),\n",
          )
          replace_once(
              path,
              "        descriptionRu,\n        descriptionKk,\n        serverIsOpenNow,\n",
              "        descriptionRu,\n        descriptionKk,\n        coverImageUrl,\n        ratingAvg,\n        ratingCount,\n        address,\n        serverIsOpenNow,\n",
          )
          replace_once(
              path,
              "int? _readNullableInt(dynamic value) {\n",
              "double? _readNullableDouble(dynamic value) {\n  if (value == null) return null;\n  if (value is num) return value.toDouble();\n\n  final text = value.toString().trim().replaceAll(',', '.');\n  if (text.isEmpty || text.toLowerCase() == 'null') return null;\n  return double.tryParse(text);\n}\n\nint? _readNullableInt(dynamic value) {\n",
          )

          # Production support number and direct WhatsApp-app launch with web fallback.
          path = 'lib/core/config/appConfig.dart'
          replace_once(
              path,
              "  static const String supportWhatsAppNumber = String.fromEnvironment(\n    'JETKIZ_SUPPORT_WHATSAPP',\n    defaultValue: '',\n  );\n",
              "  static const String supportWhatsAppNumber = String.fromEnvironment(\n    'JETKIZ_SUPPORT_WHATSAPP',\n    defaultValue: '77085139728',\n  );\n",
          )

          path = 'lib/core/support/supportLauncher.dart'
          replace_once(
              path,
              "    final uri = Uri.https('wa.me', '/$number', {\n      'text': 'Здравствуйте! Нужна помощь в приложении JETKIZ.',\n    });\n\n    final opened = await launchUrl(uri, mode: LaunchMode.externalApplication);\n    if (!opened && context.mounted) {\n      _showMessage(context, 'Не удалось открыть WhatsApp');\n    }\n",
              "    const message = 'Здравствуйте! Нужна помощь в приложении JETKIZ.';\n    final appUri = Uri(\n      scheme: 'whatsapp',\n      host: 'send',\n      queryParameters: {\n        'phone': number,\n        'text': message,\n      },\n    );\n\n    var opened = false;\n    try {\n      opened = await launchUrl(\n        appUri,\n        mode: LaunchMode.externalNonBrowserApplication,\n      );\n    } catch (_) {\n      opened = false;\n    }\n\n    if (!opened) {\n      final webUri = Uri.https('wa.me', '/$number', {'text': message});\n      try {\n        opened = await launchUrl(\n          webUri,\n          mode: LaunchMode.externalApplication,\n        );\n      } catch (_) {\n        opened = false;\n      }\n    }\n\n    if (!opened && context.mounted) {\n      _showMessage(context, 'Не удалось открыть WhatsApp');\n    }\n",
          )
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/config/appConfig.dart \
            lib/core/support/supportLauncher.dart \
            lib/features/menu/domain/restaurantMenuData.dart \
            lib/features/menu/presentation/productCardLayout.dart \
            lib/features/menu/presentation/restaurantMenuPage.dart \
            lib/features/menu/presentation/categoryProductsPage.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/config/appConfig.dart \
            lib/core/support/supportLauncher.dart \
            lib/features/menu/domain/restaurantMenuData.dart \
            lib/features/menu/presentation/productCardLayout.dart \
            lib/features/menu/presentation/restaurantMenuPage.dart \
            lib/features/menu/presentation/categoryProductsPage.dart
          git commit -m "fix(client): polish menu cards, rating and support [polish-applied]"
          git push origin HEAD:fix/final-phone-polish
