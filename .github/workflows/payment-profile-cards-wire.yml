name: Payment Profile Cards Wire

on:
  push:
    branches: [payment/paylink-production-flutter-20260908]
    paths: [.github/workflows/payment-profile-cards-wire.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: payment/paylink-production-flutter-20260908

      - name: Wire profile to payment methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('lib/features/profile/presentation/profilePage.dart')
          text = profile.read_text(encoding='utf-8')

          import_anchor = "import 'package:jetkiz_mobile/features/orders/presentation/ordersPage.dart';\n"
          payment_import = "import 'package:jetkiz_mobile/features/payments/presentation/paymentMethodsPage.dart';\n"
          if payment_import not in text:
              if import_anchor not in text:
                  raise SystemExit('profile import anchor missing')
              text = text.replace(import_anchor, import_anchor + payment_import, 1)

          old = """      _ProfileMenuItem(\n        icon: Icons.credit_card_outlined,\n        label: strings.profileAddCard,\n        iconColor: const Color(0xFF8B5CF6),\n        onTap: () => _showComingSoon(strings.profileAddCard),\n      ),\n"""
          new = """      _ProfileMenuItem(\n        icon: Icons.credit_card_outlined,\n        label: strings.profileAddCard,\n        iconColor: const Color(0xFF8B5CF6),\n        onTap: () {\n          Navigator.push(\n            context,\n            MaterialPageRoute(\n              builder: (_) => const PaymentMethodsPage(),\n            ),\n          );\n        },\n      ),\n"""
          if old not in text:
              raise SystemExit('profile card menu anchor missing')
          text = text.replace(old, new, 1)
          profile.write_text(text, encoding='utf-8')

          strings = Path('lib/core/localization/appStrings.dart')
          s = strings.read_text(encoding='utf-8')
          old_s = "String get profileAddCard => _ru ? 'Добавить карту' : 'Карта қосу';"
          new_s = "String get profileAddCard => _ru ? 'Мои карты' : 'Менің карталарым';"
          if old_s not in s:
              raise SystemExit('profileAddCard string anchor missing')
          s = s.replace(old_s, new_s, 1)
          strings.write_text(s, encoding='utf-8')
          PY

      - name: Verify no placeholder remains
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F "_showComingSoon(strings.profileAddCard)" lib/features/profile/presentation/profilePage.dart
          grep -F "PaymentMethodsPage" lib/features/profile/presentation/profilePage.dart
          grep -F "'Мои карты'" lib/core/localization/appStrings.dart

      - name: Commit production change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/payment-profile-cards-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(payments): connect profile to saved cards'
          git push origin HEAD:payment/paylink-production-flutter-20260908
