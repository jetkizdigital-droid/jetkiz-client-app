name: jetkiz_mobile
description: Jetkiz mobile client
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.4.3+1
  http: ^1.2.2
  equatable: ^2.0.5
  logger: ^2.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

  file_picker: ^8.1.2
  path_provider: ^2.1.4
  record: ^6.1.2
  url_launcher: ^6.3.2

  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4

  http_parser: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
